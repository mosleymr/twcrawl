# Include inside the existing HTTPS virtual host, before catch-all proxies.
# Requires mod_proxy and mod_proxy_http. Keep the Python listener on loopback.
ProxyRequests Off
ProxyPass "/api/" "http://127.0.0.1:8008/api/" connectiontimeout=5 timeout=60
ProxyPassReverse "/api/" "http://127.0.0.1:8008/api/"
RedirectMatch 302 "^/api$" "/api/"
